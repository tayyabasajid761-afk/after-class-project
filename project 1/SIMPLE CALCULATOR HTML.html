<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //opreaters
        var x = 10;
        var y = 5;
        document.write("x+y =" + (x + y) + "<br>");//addition
        document.write("x-y =" + (x - y) + "<br>");//subtraction
        document.write("x*y =" + (x * y) + "<br>");//multiplication
        document.write("x/y =" + (x / y) + "<br>");//division
        document.write("x%y =" + (x % y) + "<br>");//reminder
    </script>
</body>
</html>
