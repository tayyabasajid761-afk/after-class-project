<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object in js</title>
</head>
<body>
    <h2 id="obj"></h2>
    <script>
        var fruit ={
             name: "apple",
            color: "red",
            price: "100"
        }
        document.getElementById("obj").innerHTML = fruit.name + "<br>" + fruit.color + "<br>"
        + fruit ["price"];
    </script>
</body>
</html>
