<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Convert a javascript object into a json string,and send it to the server.</h2>
    <p id="result"></p>
    <script>
        var myobject = { name: "RIYA", age: 12, grade: 8 };
        var myjson = JSON.stringify(myobject); // converts object to json for sending data
        var newobj = JSON.parse(myjson); // converts to object into json while receving data
        document.getElementById("result").innerHTML = newobj.name;
    </script>
    <h2>javascript callbacks</h2>
    <p>Do a calculation and then display the result.</p>
    <p id="result"></p>
    <script>
        function myDisplayer(value) {
            document.getElementById("result").innerHTML = value;
        }
        function mycalculator(num1, num2, mycallback) {
            let sum = num1 + num2;
            mycallback(sum);
        }
        mycalculator(5, 5, myDisplayer);
    </script>
</body>
</html>
