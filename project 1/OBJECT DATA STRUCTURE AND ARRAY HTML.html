<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>javascript objects data structure and array</h2>
    <script>
        var student ={
            name: 'Riya',
            age: '12',
            grade: '7',
            hobbies: 'drawing',
            fav sport: 'cricket'
        };
        var color =["white","black","red","green","blue"];
        document.write("student name is:"+ student.name,"<br>","student favroite spot is:"+student.fav sport);
        document.write("<br>before poping the colors are:"+color.join("^"));
        document.write("<br>MY favroite color is:"+color[3]);
        color.pop();
        document.write("<br>After poping the colors are:" +color.join("*"));
    </script>
</body>
</html>
