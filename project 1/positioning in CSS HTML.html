<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        div {
            right: 30px;
            border: 3px solid #73AD21;
        }
        div.absolute {
            position: absolute;
            left: 50px;
            border: 3px solid blue;
        }
        div.relative {
            position: relative;
            left: 100px;
            border: 3px solid green;
        }
        div.fixed {
            position: fixed;
            top: 0;
            right: 20px;
            width: 100px;
            border: 3px solid blueviolet;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> POSITIONING</h2>
    <div>
        div with no position property
    </div>
    <div class="sticky">
        div with sticky position property
    </div>
    <div class="relative">
        This div element has position: relative;
        <div class="absolute">
            ABSOLUTE CLASS DIV
        </div>
    </div>
    <div class="fixed">
        DIV with fixed position property
    </div>

    <br><br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
